  const NEW_HASH='9976357b251688e58363c33ca06c22aef7451d636a57b0e4c9a4a465bd00f228';

  async function ungzipBase64(b64){
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new TextDecoder('utf-8').decode(await new Response(stream).arrayBuffer());
  }

  async function sha256(text){
    const hashBuffer=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
    return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  try{
    if(typeof DecompressionStream==='undefined') throw new Error('Atualize o Safari para abrir esta versão.');
    const paths=Array.from({length:5},(_,i)=>`./app-v6-package/chunk-${String(i).padStart(2,'0')}.b64?v=7.2`);
    const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
    if(responses.some(r=>!r.ok)) throw new Error('Não foi possível carregar os arquivos do aplicativo.');
    const chunks=await Promise.all(responses.map(r=>r.text()));
    const b64=chunks.map(x=>x.trim()).join('');
    if(b64.length!==39732) throw new Error('Pacote-base incompleto. Atualize a página.');

    let html=await ungzipBase64(b64);
    if(crypto && crypto.subtle && await sha256(html)!==OLD_HASH) throw new Error('Falha de integridade da versão-base.');

    for(const [from,to] of patchOps){
      if(!html.includes(from)) throw new Error('Não consegui aplicar uma parte da atualização da Fase 2.');
      html=html.replace(from,to);
    }

    if(crypto && crypto.subtle && await sha256(html)!==NEW_HASH) throw new Error('Falha de integridade após atualizar a Fase 2.');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);

    retry.style.display='inline-block';
  }
