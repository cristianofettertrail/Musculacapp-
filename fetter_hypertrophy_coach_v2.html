<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Fetter Hypertrophy Coach</title>
<style>
body{margin:0;background:#0b0f14;color:#f4f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#boot{min-height:70vh;display:grid;place-items:center;padding:24px;text-align:center}
#boot small{display:block;color:#9aa7b8;margin-top:8px}
</style>
</head>
<body>
<div id="boot"><div><strong>Fetter Coach</strong><small>Carregando treino...</small></div></div>
<script>
(async()=>{
  const PREVIOUS_VERSION="https://raw.githubusercontent.com/cristianofettertrail/Musculacapp-/460cb8772725e6e7c516acaa5f4c0b706066c281/fetter_hypertrophy_coach_v2.html";
  try{
    const r=await fetch(PREVIOUS_VERSION,{cache:"no-store"});
    if(!r.ok) throw new Error("Falha ao carregar base");
    let html=await r.text();
    const scripts='<script src="./volume-core-v4.js?v=4"></'+'script><script src="./volume-ui-v4.js?v=4"></'+'script>';
    html=html.replace("</body>",scripts+"</body>");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("boot").innerHTML="<div><strong>Não consegui carregar o app.</strong><small>Atualize a página. Se persistir, abra o GitHub Pages novamente.</small></div>";
    console.error(err);
  }
})();
</script>
</body>
</html>
